# .github/workflows/probe.yml — the provider probe. Collection has STOPPED.
#
# The scheduled passes are off. P18 has its answer (see README "Outcome"), so every
# further run would spend AeroDataBox units, AeroAPI dollars and FR24 credits on a
# question that is already settled.
#
# Still dispatchable by hand: run it from the Actions tab if a later decision needs
# fresh evidence. To resume collection, uncomment the schedule block below — the
# "choose the pass" step already knows how to read the truth cron.

name: provider-probe

on:
  # schedule:
  #   - cron: '17 */3 * * *'   # probe (every 3h, off the congested :00 slot)
  #   - cron: '43 23 * * *'    # truth (nightly, previous day's flights)
  workflow_dispatch:
    inputs:
      pass:
        description: which pass to run
        type: choice
        options: [probe, truth, score]
        default: probe

permissions:
  contents: write

concurrency:
  group: probe
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: choose the pass
        id: p
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "pass=${{ inputs.pass }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 23 * * *" ]; then
            echo "pass=truth" >> "$GITHUB_OUTPUT"
          else
            echo "pass=probe" >> "$GITHUB_OUTPUT"
          fi

      - name: run it
        env:
          ADB_KEY: ${{ secrets.ADB_KEY }}
          AEROAPI_KEY: ${{ secrets.AEROAPI_KEY }}
          FR24_TOKEN: ${{ secrets.FR24_TOKEN }}
        run: |
          chmod +x run.sh
          ./run.sh "${{ steps.p.outputs.pass }}"
          python3 score.py > report.txt || true

      - name: commit results
        run: |
          git config user.name  "provider-probe"
          git config user.email "provider-probe@users.noreply.github.com"
          git add observations.csv report.txt flights.csv
          git commit -m "probe: ${{ steps.p.outputs.pass }} $(date -u +%FT%TZ)" || { echo "nothing new"; exit 0; }
          git pull --rebase
          git push
